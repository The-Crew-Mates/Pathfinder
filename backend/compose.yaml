services:
  api:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DB_PATH: /srv/data/safety.sqlite3
      DELIVERY_MODE: ${DELIVERY_MODE:-demo}
      RUN_WORKER: "true"
      POLL_SECONDS: "2"
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:8000}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:5173}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
    volumes:
      - safety-data:/srv/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 10s

volumes:
  safety-data:

